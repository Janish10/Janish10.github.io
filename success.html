<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent — Janish Andrin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='12' fill='%230a0a0f'/><text y='72' x='50' text-anchor='middle' font-size='52' font-weight='900' font-family='system-ui,sans-serif' fill='%2300ff88'>JA</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .success-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .success-box {
      max-width: 480px;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid var(--border-hi);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 1.8rem;
    }
    .success-box h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -0.03em;
    }
    .success-box p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>
  <div class="success-wrap">
    <div class="success-box">
      <div class="success-icon">✓</div>
      <h1>Message sent<span style="color:var(--accent)">.</span></h1>
      <p>Thanks for reaching out — I'll get back to you within 24 hours.</p>
      <a href="index.html" class="btn btn-primary">Back to Portfolio</a>
    </div>
  </div>
</body>
</html>
